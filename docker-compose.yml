services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: energy_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d energy_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: 
      context: .
      network: host
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./media:/app/media
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      POSTGRES_DB: energy_shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: